[project]
name = "debrief-mcp"
version = "0.1.0"
description = "Evidence MCP for agents: what ggufbench measured, where a buildwright run broke, role proposals as text — never writes"
readme = "README.md"
authors = [
    { name = "Jordi Marsal", email = "jordi.marsal@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.3,<3",
]

[project.scripts]
debrief = "debrief:main"
debrief-mcp = "debrief:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=9.2.0",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py314"
# harness/tools are harness-owned scripts executed by the system python3 (<3.14),
# so py314-only syntax ruff formats towards must never be applied to them.
extend-exclude = ["harness/tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.uv.build-backend]
# Distribution is `debrief-mcp` (PyPI name), but the importable package stays
# `debrief` — module name does not have to match the distribution name.
module-name = "debrief"
module-root = "src"
